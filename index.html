<style>
/* Layout: an airline check-in flow, one question per screen. A split-flap departure board and a boarding pass open the trip; the filled-in boarding pass closes it. Each answer re-tints the cabin. */
@property --bg{syntax:"<color>";inherits:true;initial-value:#0a1328}
@property --surf{syntax:"<color>";inherits:true;initial-value:#111d38}
@property --line{syntax:"<color>";inherits:true;initial-value:#213256}
@property --accent{syntax:"<color>";inherits:true;initial-value:#ffc94a}
@property --glow{syntax:"<color>";inherits:true;initial-value:rgba(255,201,74,.14)}
@property --sky{syntax:"<color>";inherits:true;initial-value:rgba(0,0,0,0)}
:root{
  color-scheme: dark;
  --bg:#0a1328;
  --surf:#111d38;
  --line:#213256;
  --text:#f3f1ec;
  --muted:#9ea8c2;
  --accent:#ffc94a;
  --blush:#f4b6c4;
  --glow:rgba(255,201,74,.14);
  --sky:rgba(0,0,0,0);
  --paper:#f7f3ea;
  --paper-ink:#141b2e;
  --pass-navy:#13213f;
  --f-display:"Instrument Serif", "Noto Serif TC", "Times New Roman", Georgia, serif;
  --f-body:"Manrope", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-code:"Anton", Impact, "Arial Narrow", sans-serif;
  --d-style:italic; --d-case:none; --d-track:-.01em; --d-weight:400;
  transition:--bg 1s, --surf 1s, --line 1s, --accent 1s, --glow 1s, --sky 1.4s;
}
html[data-font="poster"]{--f-display:"Anton", "Noto Sans TC", Impact, "Arial Narrow", sans-serif;--d-style:normal;--d-case:uppercase;--d-track:.01em}
html[lang="yue-Hant"]{--f-display:"Noto Serif TC", "PingFang HK", "Songti TC", serif;--f-body:"Noto Sans TC", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;--d-style:normal;--d-case:none;--d-track:0;--d-weight:700}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 24px;
}
.sky-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1200px 600px at 50% -15%, var(--sky), transparent 70%),radial-gradient(900px 560px at 50% 110%, var(--glow), transparent 70%)}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:2;max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 110px)}

/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--f-code);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.logo svg{width:26px;height:26px}
.logo small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-left:4px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:color-mix(in srgb, var(--surf) 70%, transparent)}
.lang button{white-space:nowrap;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.steps{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.steps i{flex:1;height:2px;border-radius:2px;background:var(--line);transition:background .4s}
.steps i.on{background:var(--accent)}
.steps span{white-space:nowrap;padding-right:6px}

/* Page */
.page{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-block:20px}
.page.enter{animation:enter .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.q{display:flex;flex-direction:column;gap:14px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.eyebrow b{font-weight:500;border:1px solid currentColor;border-radius:4px;padding:1px 6px}
h1,h2{font-family:var(--f-display);font-weight:var(--d-weight);margin:0;text-wrap:balance;line-height:1.02;text-transform:var(--d-case);letter-spacing:var(--d-track)}
h1{font-size:clamp(46px,10.5vw,80px)}
h2{font-size:clamp(36px,8vw,60px)}
h1 em,h2 em{font-style:var(--d-style);color:var(--accent)}
html[data-font="poster"] h2{line-height:.98}
html[lang="yue-Hant"] h1{font-size:clamp(34px,8vw,54px);line-height:1.2}
html[lang="yue-Hant"] h2{font-size:clamp(28px,6.6vw,44px);line-height:1.2}
.name{color:var(--blush)}
p{margin:0;color:var(--muted);max-width:52ch}
.lead{font-size:18px;color:var(--text);opacity:.92}

/* Split-flap departure board */
.board{background:#070b16;border:1px solid #1c2540;border-radius:12px;padding:14px 16px;display:grid;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.board-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.board-row > span{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6c7799}
.flaps{display:flex;flex-wrap:wrap;gap:3px}
.flap{position:relative;width:22px;height:30px;display:grid;place-items:center;background:linear-gradient(#171e33 50%, #121829 50%);border-radius:3px;font-family:var(--f-mono);font-weight:500;font-size:17px;color:#ffc94a;box-shadow:0 1px 0 rgba(0,0,0,.6)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#05070e}
.flap.sp{background:transparent;box-shadow:none}
.flap.sp::after{display:none}
.flap.go{animation:flip .09s linear}
@keyframes flip{50%{transform:scaleY(.2)}}
.status-ok{color:#7be0a4}

/* Boarding pass */
.pass{position:relative;display:grid;grid-template-columns:1fr 132px;background:var(--paper);color:var(--paper-ink);border-radius:18px;overflow:hidden;isolation:isolate}
.pass{--nx:calc(100% - 133px);-webkit-mask:radial-gradient(circle 13px at var(--nx) 0,#0000 12.5px,#000 13.5px),radial-gradient(circle 13px at var(--nx) 100%,#0000 12.5px,#000 13.5px);-webkit-mask-composite:source-in;mask:radial-gradient(circle 13px at var(--nx) 0,#0000 12.5px,#000 13.5px),radial-gradient(circle 13px at var(--nx) 100%,#0000 12.5px,#000 13.5px);mask-composite:intersect}
.pass-wrap{position:relative}
.pass-wrap::before{content:"";position:absolute;left:6%;right:6%;bottom:-10px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(16px);z-index:-1}
.pass-head{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pass-navy);color:#f7f3ea;padding:12px 20px}
.pass-head .brand{white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:15px;letter-spacing:.16em}
.pass-head .brand svg{width:22px;height:22px}
.pass-head .cls{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffc94a}
.pass-main{padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px}
.city b{display:block;font-family:var(--f-code);font-size:44px;line-height:.9;letter-spacing:.02em}
.city span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b8298;margin-top:6px}
.city.to{text-align:right}
.flightline{position:relative;height:30px;align-self:center;display:grid;place-items:center}
.flightline::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(20,27,46,.25)}
.flightline svg{position:relative;width:30px;height:30px;color:#141b2e;background:#f7f3ea;padding:2px}
.fields{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:10px 16px;margin:0}
.fields div{min-width:0}
.fields dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b8298}
.fields dd{margin:2px 0 0;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.pass-stub{border-left:2px dashed rgba(20,27,46,.22);padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;text-align:center}
.pass-stub .seat{font-family:var(--f-code);font-size:34px;line-height:.9}
.pass-stub small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;color:#7b8298;margin-top:6px;text-transform:uppercase}
.barcode{display:block;width:100%;max-width:100px;height:40px}
.answers{display:flex;flex-direction:column;margin:0;border-top:1px solid rgba(20,27,46,.12)}
.answers div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid rgba(20,27,46,.12);font-size:14px}
.answers dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7b8298;padding-top:3px}
.answers dd{margin:0;min-width:0;font-weight:600}
.me-btn{appearance:none;font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:6px;padding:1px 8px;background:#ffc94a;color:#141b2e;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 0 0 rgba(255,201,74,.7);animation:mePulse 1.8s ease-out infinite}
.me-btn:hover{background:#f4b6c4}
@keyframes mePulse{0%{box-shadow:0 0 0 0 rgba(255,201,74,.7)}70%,100%{box-shadow:0 0 0 10px rgba(255,201,74,0)}}
.crew{max-width:560px}
.photo{position:relative;margin:0;border-radius:6px;overflow:hidden;background:#000;border:6px solid #fff;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);transform:rotate(-1deg)}
.photo img{display:block;width:100%;height:auto;max-width:100%}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.photo text{font-family:"DM Mono",ui-monospace,monospace;font-size:24px;letter-spacing:3px;fill:#ffc94a;text-transform:uppercase}
html[lang="yue-Hant"] .photo text{font-family:"Noto Sans TC",sans-serif;font-size:28px;letter-spacing:2px}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .8s ease-out .3s forwards}
.draw.d2{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{opacity:0;animation:tagIn .35s ease-out .2s forwards}
.tag.t2{animation-delay:.6s}
@keyframes tagIn{to{opacity:1}}
.upgrade-tag{display:inline-block;background:#1f9d5a;color:#fff;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.pass.in{animation:deal .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-3deg) scale(.96)}to{opacity:1;transform:none}}

/* RSVP */
.rsvp{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:84px}
.btn-yes{transition:transform .35s cubic-bezier(.3,1.5,.5,1), box-shadow .3s;transform-origin:left center}
.btn-no{appearance:none;font:inherit;font-weight:600;font-size:15px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:99px;padding:16px 26px;cursor:pointer;transition:left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1), transform .28s;touch-action:none;user-select:none;-webkit-user-select:none}
.btn-no.loose{position:fixed;z-index:14;margin:0}
.bubble{align-self:flex-start;max-width:100%;background:var(--paper);color:var(--paper-ink);font-weight:800;font-size:17px;border-radius:18px 18px 18px 4px;padding:12px 16px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 16px 40px -18px rgba(0,0,0,.8)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.no-count{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Seat map */
.cabin{align-self:center;width:100%;max-width:340px;background:var(--surf);border:1px solid var(--line);border-radius:140px 140px 28px 28px;padding:28px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.nose{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent)}
.nose svg{width:34px;height:34px}
.nose span{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--muted)}
.seatmap{display:grid;grid-template-columns:repeat(2,44px) 30px repeat(2,44px);gap:10px 8px;justify-content:center}
.aisle{display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.st{appearance:none;width:44px;height:48px;border-radius:12px 12px 8px 8px;border:1px solid var(--line);background:color-mix(in srgb, var(--line) 55%, transparent);color:var(--muted);font:inherit;font-family:var(--f-mono);font-size:12px;font-weight:500;cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .2s, background .2s, border-color .2s}
.st::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:4px;border-radius:3px;background:rgba(0,0,0,.18)}
.st svg{width:12px;height:12px;opacity:.6}
.st.free{background:transparent;border:1.5px dashed var(--accent);color:var(--accent);animation:seatGlow 1.8s ease-in-out infinite}
.st.free[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-style:solid;animation:none}
.st.me{background:#ffc94a;border-color:#ffc94a;color:#141b2e;font-weight:800;cursor:pointer}
.st:hover{transform:translateY(-2px)}
.st.nope{animation:nope .4s ease}
@keyframes nope{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes seatGlow{50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.free{border:1.5px dashed var(--accent)}
.lg.taken{background:color-mix(in srgb, var(--line) 90%, transparent)}
.lg.me{background:#ffc94a}
.seat-msg{min-height:1.6em;text-align:center;font-weight:700;color:var(--accent)}
.seat-msg.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}

/* Miles, rewards, history */
.miles,.history{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.miles-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.miles-sub{font-size:13px;color:var(--muted)}
.miles-total{display:flex;align-items:baseline;gap:6px}
.miles-total b{font-family:var(--f-code);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.miles-total span{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mi-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mi-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mi-list b{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.mi-progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mi-progress i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sub-h{margin:6px 0 0;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text)}
.rewards,.flights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rewards li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.rewards li.ok{border-color:color-mix(in srgb, var(--accent) 60%, transparent);background:color-mix(in srgb, var(--accent) 10%, transparent);color:var(--text)}
.rw-mi{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.rw-l{min-width:0}
.rw-s{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.rewards li.ok .rw-s{color:var(--accent)}
.flights li{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px}
.flights li.now{border-style:solid;border-color:color-mix(in srgb, var(--accent) 50%, transparent)}
.fl-code{font-family:var(--f-code);letter-spacing:.06em}
.fl-st{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
@media (max-width:560px){ .flights li{grid-template-columns:auto 1fr auto} .flights li > span:nth-child(3){display:none} .rewards li{grid-template-columns:54px 1fr} .rw-s{grid-column:2} }

/* Countdown */
.countdown{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--pass-navy);color:#f7f3ea;border-radius:10px;padding:10px 14px}
.countdown span{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffc94a}
.countdown b{font-family:var(--f-mono);font-weight:500;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* Captain announcement (top bar) */
.top-r{display:flex;align-items:center;gap:8px}
.pa-mini{--p:0;position:relative;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 10px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb, var(--surf) 70%, transparent);color:var(--accent);font:inherit;font-size:12px;font-weight:700;white-space:nowrap;transition:border-color .2s}
.pa-mini:hover{border-color:var(--accent)}
.pa-mini svg{width:15px;height:15px;flex:none}
.pa-lbl{color:var(--text)}
.pa-mini::after{content:"";position:absolute;inset:-2px;border-radius:99px;padding:2px;background:conic-gradient(var(--accent) calc(var(--p)*1turn), transparent 0);-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s;pointer-events:none}
.pa-mini.playing::after{opacity:1}
.pa-mini.playing svg{animation:beat .9s ease-in-out infinite}
@media (max-width:560px){ .pa-lbl{display:none} .pa-mini{width:36px;padding:0;justify-content:center} }

.pa{display:flex;flex-direction:column;gap:12px}

.pa-btn:hover{transform:translateY(-2px)}
.pa-btn .spk{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center}
.pa-btn .spk svg{width:16px;height:16px}
.wave{display:inline-flex;align-items:center;gap:3px;height:16px}
.wave i{width:3px;height:30%;border-radius:2px;background:var(--accent);opacity:.6}

.pa.playing .wave i:nth-child(2){animation-delay:.15s}.pa.playing .wave i:nth-child(3){animation-delay:.3s}.pa.playing .wave i:nth-child(4){animation-delay:.45s}.pa.playing .wave i:nth-child(5){animation-delay:.6s}
@keyframes wave{50%{height:100%;opacity:1}}
.subs{font-family:var(--f-display);font-style:var(--d-style);font-size:19px;line-height:1.4;color:var(--text);min-height:0;max-width:52ch}
.subs:empty{display:none}
.pa-bar{display:block;width:min(320px,100%);height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.pa-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .08s linear}
.subs .dim{opacity:.28}

/* Vibe cards */
.vibes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vibe{appearance:none;position:relative;overflow:hidden;clip-path:inset(0 round 20px);isolation:isolate;cursor:pointer;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:20px;padding:0;font:inherit;display:flex;flex-direction:column;background:var(--surf);transition:transform .25s, border-color .25s, box-shadow .25s}
.vibe:hover{transform:translateY(-3px)}
.vibe .art{display:block;width:100%;height:auto;aspect-ratio:320/170;max-width:100%}
.vibe .txt{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px}
.vibe .vt{margin:0;font-weight:400;font-size:34px;line-height:1}
.vibe[data-v="thrill"] .vt{font-family:"Anton","Noto Sans TC",Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#ff5b45;font-size:32px}
.vibe[data-v="cozy"] .vt{font-family:"Instrument Serif","Noto Serif TC",Georgia,serif;font-style:italic;color:#c9d9ff}
.vibe .vk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.vibe .vp{font-size:14px;color:var(--muted)}
.vibe[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.check{position:absolute;top:12px;right:12px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
[aria-pressed="true"] > .check{transform:scale(1)}
.check svg{width:14px;height:14px}
.shade{transform-box:view-box;transition:transform .7s cubic-bezier(.6,0,.2,1)}
.vibe:hover .shade,.vibe[aria-pressed="true"] .shade,.vibe:focus-visible .shade{transform:translateY(-48px)}
.sign-on{animation:signBlink 1.4s steps(1) infinite}
@keyframes signBlink{0%,60%{opacity:1}61%,100%{opacity:.25}}
.bolt-l{opacity:0;animation:boltL 4.5s linear infinite}
@keyframes boltL{0%,86%,100%{opacity:0}87%,89%{opacity:1}88%{opacity:.2}}
.cloud-d{animation:cloudD 7s ease-in-out infinite alternate}
.cloud-d.c2{animation-duration:9s;animation-direction:alternate-reverse}
@keyframes cloudD{to{transform:translateX(18px)}}
.bub{animation:bubF 5s ease-in-out infinite alternate}
.bub.b2{animation-duration:6.5s;animation-delay:-2s}.bub.b3{animation-duration:4.2s;animation-delay:-1s}
@keyframes bubF{to{transform:translateY(-12px)}}
.cloud-r{animation:cloudR 10s linear infinite alternate}
.cloud-r.c2{animation-duration:13s;animation-direction:alternate-reverse}
@keyframes cloudR{to{transform:translateX(-22px)}}
.bat{transform-box:fill-box;transform-origin:center;animation:flap .5s ease-in-out infinite alternate}
.bat.b2{animation-duration:.42s}.bat.b3{animation-duration:.58s}
@keyframes flap{to{transform:scaleY(.35)}}
.bats{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-18px,6px)}}
.win{animation:winflick 3.2s steps(1) infinite}
.win.w2{animation-delay:1.1s}.win.w3{animation-delay:2.3s}
@keyframes winflick{0%,100%{opacity:1}42%{opacity:.25}46%{opacity:1}48%{opacity:.4}52%{opacity:1}}
.fog{animation:fog 12s linear infinite alternate}
.fog.f2{animation-duration:16s;animation-direction:alternate-reverse}
@keyframes fog{to{transform:translateX(-40px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .9s ease-in-out infinite alternate}
.flame.fl2{animation-duration:1.15s}
@keyframes flame{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.88,1.12) rotate(3deg)}}
.halo{animation:halo 2.4s ease-in-out infinite alternate}
@keyframes halo{to{opacity:.55}}
.twinkle{animation:tw 2.6s ease-in-out infinite alternate}
.twinkle.t2{animation-delay:1s}.twinkle.t3{animation-delay:1.8s}
@keyframes tw{to{opacity:.2}}
.bokeh{animation:bk 6s ease-in-out infinite alternate}
.bokeh.k2{animation-duration:8s}
@keyframes bk{to{transform:translateY(-8px);opacity:.35}}

.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvl{appearance:none;cursor:pointer;font:inherit;color:var(--text);text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s, background .2s, transform .2s;min-width:0}

.lvl .bars i{flex:1;border-radius:2px;background:var(--line);transition:background .3s}
.lvl .bars i:nth-child(1){height:30%}.lvl .bars i:nth-child(2){height:55%}.lvl .bars i:nth-child(3){height:78%}.lvl .bars i:nth-child(4){height:100%}
.lvl b{font-size:14px;font-weight:700;line-height:1.3}
.lvl .bars i.on{background:color-mix(in srgb, var(--muted) 45%, transparent)}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--surf))}
.lvl[aria-pressed="true"] .bars i.on{background:var(--accent)}

.group{display:flex;flex-direction:column;gap:12px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:inherit;font-size:14px;color:var(--text);background:color-mix(in srgb, var(--surf) 80%, transparent);border:1px solid var(--line);border-radius:99px;padding:10px 16px;transition:border-color .18s, background .18s, color .18s, transform .18s}
.chip:hover{border-color:var(--muted)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.chip.no[aria-pressed="true"]{background:transparent;color:var(--accent);text-decoration:line-through;text-decoration-thickness:1.5px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times .chip{padding:14px 0;text-align:center;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;border-radius:10px}
.tease{min-height:3.4em;font-family:var(--f-display);font-style:var(--d-style);font-size:21px;line-height:1.35;color:var(--accent);text-transform:none;letter-spacing:0;opacity:0;transform:translateY(6px);transition:opacity .35s, transform .35s}
.tease.on{opacity:1;transform:none}
.tease + .actions{margin-top:8px}
html[data-font="poster"] .tease{font-family:"Instrument Serif","Noto Serif TC",Georgia,serif;font-style:italic}
.sky-note{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--accent);min-height:1.4em}

textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:color-mix(in srgb, var(--surf) 85%, transparent);border:1px solid var(--line);border-radius:16px;padding:16px;resize:vertical;line-height:1.5}
textarea::placeholder{color:var(--muted);opacity:.7}
textarea:focus{border-color:var(--accent);outline:none}

.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.btn{appearance:none;cursor:pointer;font:inherit;font-weight:800;font-size:15px;letter-spacing:.01em;border-radius:99px;padding:16px 26px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:10px;justify-content:center;transition:transform .2s, opacity .2s, box-shadow .2s;box-shadow:0 12px 30px -12px var(--glow)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.btn svg{width:16px;height:16px}
.btn.outline{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.link{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.send{display:flex;flex-direction:column;gap:12px}
.send .btn{width:100%}
.copy-msg{font-size:14px;font-weight:700;color:var(--accent);min-height:1.3em}
.pass-img{width:100%;border-radius:14px;border:1px solid var(--line)}

/* Footer */
.road{position:relative;z-index:3;padding-top:28px;display:flex;justify-content:center}
.road button{position:relative;overflow:hidden;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--text);padding:12px 20px;border-radius:99px;border:1px solid color-mix(in srgb, var(--blush) 60%, transparent);background:color-mix(in srgb, var(--blush) 12%, var(--surf));box-shadow:0 0 0 0 rgba(244,182,196,.5);animation:roadGlow 2.4s ease-in-out infinite;transition:transform .2s, background .2s}
.road button:hover{transform:translateY(-2px) scale(1.03);background:color-mix(in srgb, var(--blush) 22%, var(--surf))}
.road button .h{color:var(--blush);font-size:16px;line-height:1;animation:beat 1.2s ease-in-out infinite}
.road button .ar{color:var(--blush);transition:transform .2s}
.road button:hover .ar{transform:translateX(3px)}
.road button::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes roadGlow{50%{box-shadow:0 0 0 8px rgba(244,182,196,0), 0 0 26px rgba(244,182,196,.35)}}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}

/* Transitions */
#wipe{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0}
#wipe.flicker{animation:flicker .9s steps(1) both}
@keyframes flicker{0%{opacity:0}6%{opacity:1;background:#000}14%{opacity:.15}22%{opacity:.95;background:#2b0505}30%{opacity:.05}40%{opacity:1;background:#000}68%{opacity:.7;background:#000}100%{opacity:0}}
#wipe.bloom{animation:bloom 1.1s ease both;background:radial-gradient(circle at 50% 45%, var(--wipe-c) 0, transparent 65%)}
@keyframes bloom{0%{opacity:0;transform:scale(.3)}45%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1.7)}}
#wipe.pulse{animation:pulse .7s ease both;background:radial-gradient(circle at 50% 50%, transparent 30%, var(--wipe-c) 100%)}
@keyframes pulse{0%,100%{opacity:0}35%{opacity:.55}}
#wipe.storm{animation:storm 1s linear both}
@keyframes storm{0%{opacity:0;background:#fff}5%{opacity:.9;background:#fff}10%{opacity:0}16%{opacity:.7;background:#ffe0d6}22%{opacity:.95;background:#140405}60%{opacity:.85;background:radial-gradient(circle at 50% 40%,#3b0709,#050101 70%)}100%{opacity:0;background:#050101}}
#wipe.soft{animation:soft 1.2s ease both;background:radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--wipe-c) 45%, transparent), transparent 70%)}
@keyframes soft{0%,100%{opacity:0}40%{opacity:.7}}
.burst{position:fixed;inset:0;z-index:17;pointer-events:none;overflow:hidden}
.burst i{position:absolute;bottom:-90px;border-radius:50%;background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0 6%, transparent 9%), radial-gradient(circle, rgba(255,255,255,0) 58%, rgba(200,225,255,.18) 78%, rgba(255,255,255,.5) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,190,230,.55), inset 3px -3px 6px rgba(170,220,255,.35);animation:rise linear forwards;will-change:transform}
@keyframes rise{0%{transform:translate(0,0) scale(.8);opacity:0}12%{opacity:1}100%{transform:translate(var(--sway),-115vh) scale(1.05);opacity:.9}}
#wipe.clouds{animation:clouds 1.4s cubic-bezier(.5,0,.5,1) both;background:
  radial-gradient(40% 30% at 20% 40%, rgba(255,255,255,.95), transparent 70%),
  radial-gradient(35% 28% at 50% 60%, rgba(255,240,230,.95), transparent 70%),
  radial-gradient(40% 32% at 80% 35%, rgba(255,255,255,.9), transparent 70%),
  radial-gradient(30% 25% at 35% 80%, rgba(255,230,240,.9), transparent 70%),
  radial-gradient(30% 25% at 70% 85%, rgba(255,255,255,.85), transparent 70%);background-size:160% 100%;filter:blur(8px)}
@keyframes clouds{0%{opacity:0;background-position:100% 0}35%,60%{opacity:1}100%{opacity:0;background-position:0 0}}
.wrap.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#wipe.bolt{animation:bolt .5s linear both;background:#e9e4ff}
@keyframes bolt{0%{opacity:0}10%{opacity:.55}18%{opacity:0}30%{opacity:.35}45%,100%{opacity:0}}
.plane-fly{position:fixed;z-index:18;left:-120px;top:60vh;width:96px;height:96px;pointer-events:none;color:var(--accent);animation:fly 1.4s cubic-bezier(.5,0,.3,1) forwards;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
@keyframes fly{0%{transform:translate(0,0) rotate(-12deg)}100%{transform:translate(calc(100vw + 240px),-55vh) rotate(-28deg)}}
.trail{position:fixed;z-index:17;left:0;top:0;width:100%;height:100%;pointer-events:none}

.spook{position:fixed;z-index:12;width:60px;height:72px;cursor:pointer;border:0;background:none;padding:0;animation:spook 10s linear both;bottom:28vh;left:-90px}
.spook svg{width:100%;height:100%;filter:drop-shadow(0 0 14px rgba(230,215,255,.65))}
@keyframes spook{0%{transform:translate(0,0)}25%{transform:translate(30vw,-30px)}50%{transform:translate(55vw,12px)}75%{transform:translate(85vw,-26px)}100%{transform:translate(calc(100vw + 140px),0)}}

#toasts{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;width:min(440px, calc(100vw - 32px));pointer-events:none}
.toast{background:var(--surf);border:1px solid var(--accent);color:var(--text);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 18px 40px -18px rgba(0,0,0,.85);animation:enter .4s ease both}
.toast b{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-top:3px}

.egg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,8,18,.78);backdrop-filter:blur(8px)}
.egg-card{clip-path:inset(0 round 8px);max-width:420px;width:100%;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:30px 26px;display:flex;flex-direction:column;gap:16px;animation:enter .4s ease both;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px #000}
.egg-card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(45deg,#c9302c 0 10px,#f7f3ea 10px 20px,#1f4e9c 20px 30px,#f7f3ea 30px 40px)}
.egg-card .file{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#1f4e9c;padding-right:90px}
.egg-card h3{font-family:"Instrument Serif","Noto Serif TC",Georgia,serif;font-weight:400;font-size:34px;line-height:1.15;margin:0}
.egg-card h3 s{color:#9a98a6;text-decoration-color:#c9302c;text-decoration-thickness:2px}
.egg-card p{color:#535a6e}
.status{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;border:1px solid rgba(20,27,46,.15);border-radius:8px;padding:10px 12px}
.status i{width:8px;height:8px;border-radius:50%;background:#e0a400;flex:none}
.status.ok i{background:#1f9d5a}
.egg-actions{display:flex;flex-wrap:wrap;gap:10px}
.egg-actions .btn{flex:1 1 150px;background:var(--pass-navy);border-color:var(--pass-navy);color:var(--paper);box-shadow:none}
.egg-actions .btn.outline{background:transparent;color:var(--paper-ink);border-color:rgba(20,27,46,.25)}
.stamp-ok{position:absolute;right:16px;top:24px;transform:rotate(12deg);border:2px solid #1f9d5a;color:#1f9d5a;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.16em;padding:4px 8px;border-radius:4px}
.heart-fx{position:fixed;z-index:30;pointer-events:none;color:var(--blush);animation:float 1.9s ease-out forwards}
@keyframes float{to{transform:translateY(-60vh) rotate(25deg);opacity:0}}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:560px){
  .steps span{display:none}
  .logo small{display:none}
  .logo{font-size:15px;letter-spacing:.1em}
  .lang button{padding:6px 10px}
  .copy-msg:empty{min-height:0}
  .vibes{grid-template-columns:1fr}
  .meter{grid-template-columns:1fr 1fr}
  .times{grid-template-columns:repeat(3,1fr)}
  .board-row{grid-template-columns:1fr;gap:4px}

  .pass{grid-template-columns:1fr}

  .pass-stub{border-left:0;border-top:2px dashed rgba(20,27,46,.22);flex-direction:row;padding:14px 20px}
  .city b{font-size:36px}

  .actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="sky-layer" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div id="wipe" aria-hidden="true"></div>

<main class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffc94a" d="M21.5 15.5v-2L13.5 8.5V3a1.5 1.5 0 0 0-3 0v5.5l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5l-2-1.5v-5.5z"/><g fill="#13213f" fill-opacity=".78" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="3.1"><text x="17.4" y="13.8" text-anchor="middle" transform="rotate(32 17.4 12.7)">E</text><text x="17.4" y="13.8" text-anchor="middle" transform="matrix(-1 0 0 1 24 0) rotate(32 17.4 12.7)">E</text></g></svg>Elliot Air<small>EA3010</small></div>
    <div class="top-r">
    <button type="button" class="pa-mini" id="paBtn" aria-label="Captain speaking"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="pa-lbl" id="paTxt"></span></button>

      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="yue">廣東話</button>

    </div>
  </div>
  <div class="steps" id="steps" aria-hidden="true"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    const p = {x:rnd(0,W), y:init ? rnd(0,H) : H + 40*d, r:rnd(.4,1.6)*d, p:rnd(0,6.28), v:rnd(.3,1)};
    if (mode==="mist"){ p.r = rnd(90,200)*d; p.v = rnd(.15,.4); p.y = rnd(H*.35,H); }
    if (mode==="bubbles"){ p.r = rnd(8,30)*d; p.v = rnd(.25,.7); p.a = rnd(.45,.9); p.w = rnd(.6,1.4); }
    return p;
  }
  function make(){
    const area = innerWidth*innerHeight;
    const per = mode==="mist" ? 70000 : mode==="stars" ? 9000 : mode==="bubbles" ? 26000/Math.max(.6, speed) : 12000;
    parts = Array.from({length:Math.max(10, Math.min(140, Math.round(area/per)))}, () => spawn(true));
    if (mode==="mist") for (let i=0;i<40;i++) parts.push({x:rnd(0,W), y:rnd(0,H), r:rnd(.6,1.6)*d, p:rnd(0,6.28), v:rnd(.4,1), ember:true});
  }
  function size(){
    d = Math.min(devicePixelRatio || 1, 1.5);
    W = c.width = Math.round(innerWidth*d); H = c.height = Math.round(innerHeight*d);
    if (Math.abs(innerWidth - lastW) > 40 || !parts.length){ lastW = innerWidth; make(); }
    else parts.forEach(p => { if (p.y > H) p.y = Math.random()*H; });
  }
  function frame(tm){
    x.clearRect(0,0,W,H);
    x.fillStyle = color;
    for (const p of parts){
      if (mode==="stars"){ x.globalAlpha = .25+.35*Math.sin(p.p+tm/1500); x.beginPath(); x.arc(p.x,p.y,p.r,0,6.28); x.fill(); continue; }
      if (mode==="bubbles"){
        p.y -= p.v*d*speed*.8; p.x += Math.sin(tm/1800 + p.p)*.35*d;
        const wob = 1 + Math.sin(tm/600 + p.p)*.04, s = p.r*2;
        x.globalAlpha = p.a;
        x.drawImage(BUBBLE, p.x - s*wob/2, p.y - s/wob/2, s*wob, s/wob);
        if (p.y < -p.r*2) Object.assign(p, spawn(false));
        continue;
      }
      if (mode==="embers" || p.ember){
        p.y -= p.v*1.3*d*speed; p.x += Math.sin(tm/700+p.p)*.5*d;
        x.globalAlpha = .35+.5*Math.abs(Math.sin(tm/170+p.p)); x.beginPath(); x.arc(p.x,p.y,p.r*1.4,0,6.28); x.fill();
        if (p.y < -20*d){ p.y = H+10*d; p.x = rnd(0,W); }
        continue;
      }
      if (mode==="mist"){
        p.x += p.v*d*speed; if (p.x-p.r > W) p.x = -p.r;
        x.globalAlpha = .1; x.drawImage(MIST, p.x-p.r, p.y-p.r, p.r*2, p.r*2);
      }
    }
    x.globalAlpha = 1;
    if (!reduceMotion) requestAnimationFrame(frame); else running = false;
  }
  addEventListener("resize", size);
  size();
  const start = () => { if (!running){ running = true; requestAnimationFrame(frame); } };
  start();
  return { set(m, col, sp){
    color = col; const changed = m !== mode || Math.abs(sp - speed) > .3; speed = sp;
    if (m==="mist") MIST = mistSprite(col);
    if (changed){ mode = m; make(); }
    if (reduceMotion) start();
  } };
})();

/* ---------- Scene engine ---------- */
let sceneId = "";
function sceneFor(){
  if (!state.vibe) return BASE;
  return (state.vibe==="thrill" ? THRILL : COZY)[state.level ?? 1];
}
function applyScene(kind){
  const sc = sceneFor(), id = (state.vibe||"base")+(state.level ?? "");
  if (id === sceneId) return;
  sceneId = id;
  const swap = () => {
    for (const k of ["bg","surf","line","accent","glow"]) root.style.setProperty("--"+k, sc[k]);
    root.dataset.font = sc.font;
    fx.set(sc.fx, sc.pc, sc.speed);
    manageGhost();
  };
  if (kind && !reduceMotion){
    wipe(kind, sc.accent);
    if (kind==="storm" || kind==="flicker"){ const w = document.querySelector(".wrap"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); }
    setTimeout(swap, kind==="bubbles" ? 380 : kind==="storm" ? 260 : 300);
  }
  else swap();
}
function bubbleBurst(n){
  if (reduceMotion) return;
  const box = document.createElement("div"); box.className = "burst";
  for (let i=0;i<n;i++){
    const b = document.createElement("i"), sz = 18 + Math.random()*56;
    b.style.cssText = `left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*.5).toFixed(2)}s;animation-duration:${(1.6+Math.random()*1.2).toFixed(2)}s;--sway:${(Math.random()*80-40).toFixed(0)}px`;
    box.appendChild(b);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3400);
}
function wipe(kind, color){
  if (reduceMotion) return;
  if (kind==="bubbles"){ bubbleBurst(26); kind = "soft"; }
  const w = document.getElementById("wipe");
  w.className = ""; void w.offsetWidth;
  w.style.setProperty("--wipe-c", color);
  w.className = kind;
}
function applySky(){ root.style.setProperty("--sky", state.pick===null ? "rgba(0,0,0,0)" : SKY[state.pick]); }
function flyPlane(){
  if (reduceMotion) return;
  const p = document.createElement("div");
  p.className = "plane-fly"; p.innerHTML = PLANE_SIDE;
  document.body.appendChild(p); setTimeout(() => p.remove(), 1500);
}

/* Lightning and a ghost appear at turbulence "No limits" */
let ghostTimer = null, boltTimer = null;
function manageGhost(){
  clearTimeout(ghostTimer); clearTimeout(boltTimer);
  document.querySelectorAll(".spook").forEach(g => g.remove());
  if (state.vibe!=="thrill" || state.level!==3 || reduceMotion) return;
  const bolt = () => { wipe("bolt", "#fff"); boltTimer = setTimeout(bolt, 6000 + Math.random()*6000); };
  boltTimer = setTimeout(bolt, 2500);
  const ghost = () => {
    const g = document.createElement("button");
    g.type = "button"; g.className = "spook"; g.setAttribute("aria-label","Boo");
    g.innerHTML = `<svg viewBox="0 0 58 70" aria-hidden="true"><path d="M29 2C14 2 5 13 5 27v40l8-6 8 6 8-6 8 6 8-6 8 6V27C53 13 44 2 29 2z" fill="#f1eaff" fill-opacity=".92"/><ellipse cx="21" cy="28" rx="3.5" ry="5" fill="#170a0c"/><ellipse cx="37" cy="28" rx="3.5" ry="5" fill="#170a0c"/><ellipse cx="29" cy="42" rx="5" ry="6" fill="#170a0c"/></svg>`;

}

/* ---------- Split-flap board ---------- */
const FLAP_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789?";
function flaps(text){ return [...text].map(ch => `<span class="flap ${ch===" "?"sp":""}" data-c="${esc(ch)}">${ch===" "?"":esc(ch)}</span>`).join(""); }
function runBoard(){
  const all = document.querySelectorAll(".board .flap:not(.sp)");
  all.forEach((el, i) => {
    const target = el.dataset.c;
    if (reduceMotion) return;
    let n = 6 + (i % 7) + Math.floor(i/3);
    const tick = () => {
      if (n-- <= 0){ el.textContent = target; el.classList.remove("go"); return; }
      el.textContent = FLAP_CHARS[Math.floor(Math.random()*FLAP_CHARS.length)];
      el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
      setTimeout(tick, 70);
    };
    setTimeout(tick, 200 + i*25);
  });
}

  if (found.has(id)) return;

    [tx.r.crave, list(state.crave, CRAVE, tx.any)],

function openCrew(){
  $egg.innerHTML = `<div class="egg-card crew" role="dialog" aria-modal="true" aria-labelledby="crewH">
    <div class="file">${t("crewEye")}</div>
    <h3 id="crewH">${t("crewH")}</h3>
    <figure class="photo">
      <img src="${PHOTO}" alt="">
      <svg viewBox="0 0 900 558" aria-hidden="true">
        <g fill="none" stroke="#ffc94a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw" d="M150 118 C 260 110, 360 140, 432 214"/><path class="draw" d="M402 196 L436 218 L426 178"/>
          <path class="draw d2" d="M760 96 C 730 120, 700 150, 684 196"/><path class="draw d2" d="M664 170 L682 202 L708 176"/>
        </g>
        <g class="tag"><rect x="24" y="68" rx="8" width="220" height="54" fill="#13213f"/><text x="134" y="104" text-anchor="middle">${esc(t("pilot"))}</text></g>
        <g class="tag t2"><rect x="618" y="40" rx="8" width="272" height="54" fill="#13213f"/><text x="754" y="76" text-anchor="middle" ${lang==="en" ? 'textLength="236" lengthAdjust="spacingAndGlyphs"' : ""}>${esc(t("pax"))}</text></g>
      </svg>
    </figure>
    <p>${t("crewP")}</p>
    <div class="egg-actions"><button type="button" class="btn" id="eggClose">${t("crewClose")}</button></div>
  </div>`;
  $egg.hidden = false;
  document.getElementById("eggClose").onclick = closeEgg;
  document.getElementById("eggClose").focus();
  hearts(12);
}
function passHead(){
  return `<div class="pass-head"><span class="brand">${LOGO}ELLIOT AIR</span><span class="cls">${t("cls")}</span></div>`;
}
function routeRow(){
  return `<div class="route">
    <div class="city"><b>${t("from")}</b><span>${t("fromL")}</span></div>
    <div class="flightline">${PLANE_SIDE}</div>
    <div class="city to"><b>${t("to")}</b><span>${t("toL")}</span></div>
  </div>`;

/* The "No" button runs away before it can be pressed */
let lastDodge = 0;
function dodge(e){
  if (e){ e.preventDefault(); e.stopPropagation(); }
  const no = document.getElementById("no"); if (!no) return;
  const now = Date.now(); if (now - lastDodge < 300) return; lastDodge = now;
  state.noTries++;
  noLine = (noLine + 1) % NO_LINES.length;
  const r = no.getBoundingClientRect();
  const pad = 16, vw = innerWidth, vh = innerHeight;
  const yes = document.getElementById("yes").getBoundingClientRect();
  let x, y, tries = 0;
  do {
    x = pad + Math.random()*(vw - r.width - pad*2);
    y = 90 + Math.random()*(vh - r.height - 200);
    tries++;
  } while (tries < 20 && ((Math.abs(x - r.left) < 120 && Math.abs(y - r.top) < 80) || (x < yes.right+20 && x + r.width > yes.left-20 && y < yes.bottom+20 && y + r.height > yes.top-20)));
  if (!no.classList.contains("loose")){
    no.style.left = r.left+"px"; no.style.top = r.top+"px";
    no.classList.add("loose"); document.body.appendChild(no);
    void no.offsetWidth;
  }
  no.style.left = x+"px"; no.style.top = y+"px";
  no.style.transform = `scale(${Math.max(.7, 1 - state.noTries*.04)}) rotate(${(Math.random()*16-8).toFixed(1)}deg)`;
  const bub = document.getElementById("bubble");
  bub.hidden = false; bub.className = ""; void bub.offsetWidth; bub.textContent = L(NO_LINES[noLine]); bub.className = "bubble";
  document.getElementById("yes").style.transform = `scale(${Math.min(1.5, 1 + state.noTries*.08)})`;
  let cnt = document.querySelector(".no-count");
  if (!cnt){ cnt = document.createElement("div"); cnt.className = "no-count"; document.getElementById("rsvp").after(cnt); }
  cnt.textContent = t("tries")(state.noTries);
  if (state.noTries === 3) wipe("pulse", "#ff4d6d");
}

    applyScene(state.vibe==="thrill" ? (state.level>=2 ? "storm" : "flicker") : "bubbles");

    if (b.classList.contains("taken")){ b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); say(L(TAKEN[takenIx++ % TAKEN.length])); return; }
    if (id==="1B"){ say(t("captainSeat")); return; }

  document.querySelectorAll(".me-btn").forEach(b => b.onclick = e => { e.stopPropagation(); openCrew(); });
  const dt = document.getElementById("dateTap");
  if (dt) dt.onclick = () => { if (++dateTaps >= 3){ dateTaps = 0; openEgg(); } };

/* ---------- Elliot Air Miles (revealed only on the boarding pass) ---------- */
const PREVIOUS_FLIGHTS = []; /* add past dates here: {code:"EA3010", date:"30 Oct 2026", dest:"Haunted house"} */
function milesBreakdown(){
  const m = t("mi"), out = [[m.booking, 1000]];
  out.push(state.noTries ? [m.tries(state.noTries), 100] : [m.quick, 500]);
  if (state.seat) out.push([m.seat, 200]);
  if (state.vibe) out.push([m.vibe, 300]);
  if (state.level!==null) out.push(state.vibe==="thrill" ? [m.lvlT, 150*(state.level+1)] : [m.lvlC, 150*(4-state.level)]);
  if (state.crave.length) out.push([m.meal, 100*state.crave.length]);
  if (state.crave.includes(COOK)) out.push([m.brave, 250]);
  if (state.note.trim()) out.push([m.note, 300]);
  if (found.size) out.push([m.secrets(found.size), 250*found.size]);
  if (state.upgraded) out.push([m.upgrade, 1000]);
  return out;
}
const milesTotal = () => milesBreakdown().reduce((a,[,v]) => a+v, 0);
const fmt = n => n.toLocaleString("en");
function milesBlock(){
  const total = milesTotal(), rw = t("rewards");
  const next = rw.find(([need]) => total < need);
  const prev = [...rw].reverse().find(([need]) => total >= need);
  const lo = prev ? prev[0] : 0, hi = next ? next[0] : rw[rw.length-1][0];
  const pct = next ? Math.round((total-lo)/(hi-lo)*100) : 100;
  return `<section class="miles">
    <div class="miles-top">
      <div><div class="eyebrow">${PLANE.replace('<svg','<svg style="width:14px;height:14px"')}${t("milesEye")}</div><p class="miles-sub">${t("milesH")}</p></div>
      <div class="miles-total"><b id="milesNum" data-to="${total}">${fmt(total)}</b><span>mi</span></div>
    </div>
    <ul class="mi-list">${milesBreakdown().map(([k,v]) => `<li><span>${esc(k)}</span><b>+${fmt(v)}</b></li>`).join("")}</ul>
    <div class="mi-progress"><i style="width:${pct}%"></i></div>
    <p class="miles-sub">${next ? esc(t("milesNext")(next[0]-total)) : esc(t("milesMax"))}</p>
    <h3 class="sub-h">${t("rewardsH")}</h3>
    <ul class="rewards">${rw.map(([need, label]) => { const ok = total >= need; return `<li class="${ok?"ok":""}"><span class="rw-mi">${fmt(need)}</span><span class="rw-l">${esc(label)}</span><span class="rw-s">${ok ? "✓ "+t("unlocked") : t("locked")}</span></li>`; }).join("")}</ul>
  </section>
  <section class="history">
    <h3 class="sub-h">${t("histH")}</h3>
    <ul class="flights">
      <li class="now"><span class="fl-code">EA3010</span><span>${t("dateV")}</span><span>${t("histDest")}</span><span class="fl-st">${t("histNow")}</span></li>
      ${PREVIOUS_FLIGHTS.map(f => `<li><span class="fl-code">${esc(f.code)}</span><span>${esc(f.date)}</span><span>${esc(f.dest)}</span><span class="fl-st done">✓</span></li>`).join("")}
    </ul>
    ${PREVIOUS_FLIGHTS.length ? "" : `<p class="miles-sub">${t("histEmpty")}</p>`}
  </section>`;
}
function countUp(){
  const el = document.getElementById("milesNum"); if (!el || reduceMotion) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 1400;
  const step = now => { const k = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = fmt(Math.round(to*e)); if (k < 1) requestAnimationFrame(step); };
  el.textContent = "0"; requestAnimationFrame(step);
}

/* ---------- Countdown to takeoff (Kuala Lumpur time) ---------- */
function takeoffTime(){
  const [hh, mm] = (state.pick===null ? "18:00" : TIMES[state.pick][1]).split(":").map(Number);
  return Date.UTC(2026, 9, 30, hh - 8, mm);
}
function countdownText(){
  let ms = takeoffTime() - Date.now();
  if (ms <= 0) return t("cdNow");
  const u = t("cdUnits"), dd = Math.floor(ms/864e5); ms -= dd*864e5;
  const h = Math.floor(ms/36e5); ms -= h*36e5;
  const m = Math.floor(ms/6e4); const sec = Math.floor((ms - m*6e4)/1e3);
  const p = n => String(n).padStart(2,"0");
  return `${dd}${u[0]} ${p(h)}${u[1]} ${p(m)}${u[2]} ${p(sec)}${u[3]}`;
}
setInterval(() => { const el = document.getElementById("cd"); if (el) el.textContent = countdownText(); }, 1000);

/* ---------- Captain announcement: loads the voice file only when tapped ---------- */
let paAudio = null, paTimer = null, paPlaying = false;
const paEl = () => document.getElementById("paBtn");
function paProgress(p){ const b = paEl(); if (b) b.style.setProperty("--p", Math.max(0, Math.min(1, p)).toFixed(3)); }
function paLabel(){ const tx = document.getElementById("paTxt"); if (tx) tx.textContent = paPlaying ? t("paStop") : t("paBtn"); const b = paEl(); if (b) b.setAttribute("aria-label", paPlaying ? t("paStop") : t("paBtn")); }
function paStop(){
  paPlaying = false; clearInterval(paTimer);
  if (paAudio) paAudio.pause();
  try { speechSynthesis.cancel(); } catch(e){}
  const b = paEl(); if (b) b.classList.remove("playing");
  paProgress(0); paLabel();
}
function paPlay(){
  if (paPlaying){ paStop(); return; }
  paPlaying = true; paEl().classList.add("playing"); paLabel(); paProgress(0);
  if (CAPTAIN_AUDIO){
    if (!paAudio){ paAudio = new Audio(CAPTAIN_AUDIO); paAudio.preload = "auto"; }
    paAudio.currentTime = 0;
    paAudio.onended = paStop;
    paAudio.play().catch(paStop);
    paTimer = setInterval(() => { if (paAudio.duration) paProgress(paAudio.currentTime / paAudio.duration); }, 80);
    return;
  }
  const text = t("paText"), est = Math.max(6000, text.length * (lang==="en" ? 62 : 230)), t0 = Date.now();
  paTimer = setInterval(() => paProgress((Date.now()-t0)/est), 100);
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang==="en" ? "en-GB" : "zh-HK"; u.rate = .95;
    u.onend = paStop; u.onerror = paStop;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){ setTimeout(paStop, est); }
}
document.getElementById("paBtn").onclick = paPlay;

/* ---------- Boarding pass as an image ---------- */
let passBlob = null;
function renderPassBlob(){
  const el = document.querySelector(".pass");
  el.classList.remove("in");
  if (!window.html2canvas) return Promise.reject(new Error("no renderer"));
  return html2canvas(el, {scale:2, backgroundColor:getComputedStyle(document.body).backgroundColor, useCORS:true, logging:false})
    .then(c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/png")))
    .then(b => (passBlob = b));
}
async function copyPassImage(btn){
  const msg = document.getElementById("copyMsg");
  msg.textContent = t("preparing"); btn.disabled = true;
  const blobP = renderPassBlob();
  let copied = false;
  try {
    if (navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"image/png": blobP})]);
      copied = true;
    }
  } catch(e){}
  let blob = null;
  try { blob = await blobP; } catch(e){}
  btn.disabled = false;
  if (copied){ msg.textContent = t("copied"); flyPlane(); hearts(14); return; }
  if (!blob){ msg.textContent = t("copyFail"); return; }
  const img = document.getElementById("passImg");
  img.src = URL.createObjectURL(blob); img.alt = t("s6Eye"); img.hidden = false;
  msg.textContent = t("holdToSave");
  const dl = await (window.claude?.use ? window.claude.use("downloads").catch(() => null) : null);
  const sv = document.getElementById("savePass");
  if (!dl && sv){
    const file = new File([passBlob], "elliot-air-boarding-pass.png", {type:"image/png"});
    const canShare = navigator.canShare && navigator.canShare({files:[file]});
    sv.hidden = false; sv.textContent = canShare ? t("share") : t("save");
    sv.onclick = async () => {
      if (canShare){ try { await navigator.share({files:[file], title:"Elliot Air · EA3010"}); msg.textContent = t("savedMsg"); } catch(e){} return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(passBlob); a.download = "elliot-air-boarding-pass.png";
      document.body.appendChild(a); a.click(); a.remove(); msg.textContent = t("savedMsg");
    };
  }
  if (dl && sv){
    sv.hidden = false;
    sv.onclick = async () => {
      try { await dl.save({filename:"elliot-air-boarding-pass.png", data:passBlob}); msg.textContent = t("savedMsg"); }
      catch(err){ if (err && err.code !== "declined") sv.hidden = true; }
    };
  }
}

/* ---------- The situationship file: tap "Road to girlfriend", tap seat 1A three times, or type "eunice" ---------- */
let dateTaps = 0, typed = "";
const $egg = document.getElementById("egg");
function renderEgg(){
  const ok = state.upgraded;
  $egg.innerHTML = `<div class="egg-card" role="dialog" aria-modal="true" aria-labelledby="eggH">
    ${ok ? `<div class="stamp-ok">${t("stampOk")}</div>` : ""}
    <div class="file">${t("eggFile")}</div>
    <h3 id="eggH">${ok ? t("eggHOk") : t("eggH")}</h3>
    <p>${t("eggP")}</p>
    <div class="status ${ok?"ok":""}"><i></i>${ok ? t("eggOk") : t("eggPending")}</div>
    ${ok ? `<p>${t("eggDone")}</p>` : ""}
    <div class="egg-actions">${ok
      ? `<button type="button" class="btn outline" id="eggClose">${t("eggClose")}</button>`
      : `<button type="button" class="btn" id="eggYes">${t("eggYes")}</button><button type="button" class="btn outline" id="eggClose">${t("eggNo")}</button>`}</div>
  </div>`;
  document.getElementById("eggClose").onclick = closeEgg;
  const y = document.getElementById("eggYes");
  if (y) y.onclick = () => { state.upgraded = true; hearts(26); renderEgg(); if (STEPS[state.step]==="pass") render(false); };
}
function openEgg(){ unlock("file"); renderEgg(); $egg.hidden = false; document.getElementById("eggClose").focus(); }
function closeEgg(){ $egg.hidden = true; }
$egg.addEventListener("click", e => { if (e.target === $egg) closeEgg(); });
document.getElementById("eggBtn").onclick = openEgg;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$egg.hidden) return closeEgg();
  if (e.target.matches("input,textarea")) return;
  if (e.key.length === 1){
    typed = (typed + e.key.toLowerCase()).slice(-6);
    if (typed === "eunice") openEgg();
    if (typed === "elliot") unlock("elliot");
  }
});

render();
applyScene(null);
